<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Hanken Grotesk, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#15181C">
  <title>Ragnarok architecture</title>
  <desc>Dashboard and API on top; the code-enforced trial state machine with the four agents in the middle; tools, LLM client, retrieval, calculations, memory, the SQLite store and the ingest pipeline below. Documents are untrusted data.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15181C"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B4C9B"/>
    </marker>
    <style>
      .box { fill: #FFFFFF; stroke: #D3D8DD; stroke-width: 1.2; }
      .ink { fill: #FFFFFF; stroke: #15181C; stroke-width: 1.4; }
      .odin { fill: #EEF2FA; stroke: #2B4C9B; stroke-width: 1.6; }
      .band { fill: #F6F7F8; stroke: #D3D8DD; stroke-width: 1; }
      .warn { fill: #FDF1EF; stroke: #B42318; stroke-width: 1; stroke-dasharray: 4 3; }
      .h { font-weight: 600; font-size: 14px; }
      .lbl { font-size: 11px; letter-spacing: .07em; fill: #8A929B; font-weight: 600; }
      .s { font-size: 12px; fill: #575F69; }
      .mono { font-family: IBM Plex Mono, Consolas, monospace; font-size: 11.5px; fill: #575F69; }
      .bad { fill: #B42318; font-size: 12px; }
      .acc { fill: #2B4C9B; font-size: 12px; }
      .l { stroke: #15181C; stroke-width: 1.3; fill: none; }
      .lb { stroke: #2B4C9B; stroke-width: 1.5; fill: none; }
      .ld { stroke: #8A929B; stroke-width: 1.1; fill: none; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="#FFFFFF"/>

  <!-- top: user, dashboard, API -->
  <text x="24" y="30" class="lbl">USER AND INTERFACE</text>
  <rect x="24" y="42" width="170" height="70" rx="5" class="ink"/>
  <text x="40" y="68" class="h">User</text>
  <text x="40" y="88" class="s">question + as-of date</text>
  <text x="40" y="103" class="s">new event packs</text>

  <rect x="230" y="42" width="430" height="70" rx="5" class="box"/>
  <text x="246" y="66" class="h">React dashboard (Vite, TypeScript, Tailwind)</text>
  <text x="246" y="86" class="s">Trial · Exposure · Evidence (live feed, viewer) · Briefing · Run trace</text>
  <text x="246" y="103" class="s">only recorded events are shown; every citation opens its paragraph / trade row</text>

  <rect x="700" y="42" width="476" height="70" rx="5" class="box"/>
  <text x="716" y="66" class="h">FastAPI</text>
  <text x="716" y="86" class="mono">POST /cases · GET /cases/{id} · /cases/{id}/events (SSE) · /resume</text>
  <text x="716" y="103" class="mono">GET /docs · /trade · /feed (as-of gated) · POST /ingest</text>

  <path d="M194,77 L228,77" class="l" marker-end="url(#a)"/>
  <path d="M660,77 L698,77" class="l" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- trial state machine -->
  <text x="24" y="150" class="lbl">TRIAL STATE MACHINE · FLOW, LIMITS AND RUN LOOP ENFORCED IN CODE · NO PLANNER</text>
  <rect x="24" y="160" width="1152" height="300" rx="6" class="band"/>
  <path d="M938,112 L938,158" class="l" marker-end="url(#a)"/>
  <text x="946" y="140" class="s">runs a case in a background thread</text>

  <!-- Heimdall -->
  <rect x="44" y="186" width="200" height="148" rx="5" class="box" style="stroke:#575F69;stroke-dasharray:5 3"/>
  <text x="60" y="210" class="h">Heimdall · gatekeeper</text>
  <text x="60" y="232" class="s">question → Case File (as-of)</text>
  <text x="60" y="249" class="s">seed searches from the question</text>
  <text x="60" y="266" class="s">event check: established /</text>
  <text x="60" y="281" class="s">disproved / uncertain, corrections</text>
  <text x="60" y="298" class="s">run 2: new targeted searches,</text>
  <text x="60" y="313" class="s">novelty check on new evidence</text>

  <!-- Thor / Loki -->
  <rect x="282" y="186" width="190" height="66" rx="5" class="ink" style="fill:#15181C"/>
  <text x="298" y="211" class="h" style="fill:#FFFFFF">Thor · the Alarm</text>
  <text x="298" y="232" class="s" style="fill:#F6F7F8">high exposure, own searches,</text>
  <text x="298" y="246" class="s" style="fill:#F6F7F8">claims + calc-backed estimates</text>
  <rect x="282" y="268" width="190" height="66" rx="5" class="ink"/>
  <text x="298" y="293" class="h">Loki · the Trickster</text>
  <text x="298" y="314" class="s">limited exposure (substitutes,</text>
  <text x="298" y="328" class="s">routes, stocks) — in parallel</text>

  <!-- cross exam -->
  <rect x="510" y="186" width="210" height="148" rx="5" class="box"/>
  <text x="526" y="210" class="h">Cross-examination</text>
  <text x="526" y="232" class="s">≥ 1 attack each way: target,</text>
  <text x="526" y="249" class="s">objection, counter-evidence or gap</text>
  <text x="526" y="270" class="s">defend with NEW evidence</text>
  <text x="526" y="287" class="s">or concede (checked in code)</text>
  <text x="526" y="308" class="s">undefended → stays on record</text>

  <!-- Odin -->
  <rect x="758" y="186" width="210" height="148" rx="5" class="odin"/>
  <text x="774" y="210" class="h" style="fill:#2B4C9B">Odin · judge</text>
  <text x="774" y="232" class="s">code pre-checks every citation,</text>
  <text x="774" y="249" class="s">replays every calculation</text>
  <text x="774" y="270" class="s">rules on every claim: established /</text>
  <text x="774" y="285" class="s">contested / conceded / rejected</text>
  <text x="774" y="306" class="s">own range · sufficiency check</text>

  <!-- briefing -->
  <rect x="1006" y="186" width="150" height="148" rx="5" class="box"/>
  <text x="1022" y="210" class="h">Briefing</text>
  <text x="1022" y="232" class="s">from Odin's rulings</text>
  <text x="1022" y="249" class="s">only; every citation</text>
  <text x="1022" y="266" class="s">re-validated</text>
  <text x="1022" y="287" class="s">Markdown · JSON · PDF</text>
  <text x="1022" y="308" class="s">complete / partial /</text>
  <text x="1022" y="323" class="s">incomplete (honest)</text>

  <path d="M244,240 L280,222" class="l" marker-end="url(#a)"/>
  <path d="M244,280 L280,298" class="l" marker-end="url(#a)"/>
  <path d="M472,219 L508,240" class="l" marker-end="url(#a)"/>
  <path d="M472,301 L508,280" class="l" marker-end="url(#a)"/>
  <path d="M720,260 L756,260" class="l" marker-end="url(#a)"/>
  <path d="M968,260 L1004,260" class="lb" marker-end="url(#b)"/>
  <text x="970" y="248" class="acc" font-size="11">sufficient</text>

  <!-- send-back loop -->
  <path d="M863,334 L863,392 L144,392 L144,336" class="lb" marker-end="url(#b)"/>
  <text x="300" y="384" class="acc">send-back: Odin names the missing evidence → run 2 (≤ MAX_RUNS); no new evidence → incomplete briefing</text>
  <text x="44" y="424" class="s">Hard limits in code: runs, cross-exam rounds, tool calls per agent and case, tokens, model requests, retries, retrieved evidence.</text>
  <text x="44" y="443" class="s">Failures recorded, never hidden: one side fails → the other "went unchallenged"; Odin fails → no briefing from unruled claims; quota → pause.</text>

  <!-- second layer: tools + llm -->
  <text x="24" y="488" class="lbl">AGENT TOOLS (PERMISSION-CHECKED PER AGENT)</text>
  <rect x="24" y="498" width="560" height="96" rx="5" class="box"/>
  <text x="40" y="522" class="mono">search · read_doc · get_trade_rows · trade_calc · validate_citation</text>
  <text x="40" y="544" class="s">Heimdall: search, read, rows · Thor / Loki: + trade_calc · Odin: read, calc, validate (no search)</text>
  <text x="40" y="563" class="s">as_of is never a tool argument; out-of-window requests → CLOCK_VIOLATION_BLOCKED</text>
  <text x="40" y="582" class="s">documents reach prompts only inside &lt;document id tier date&gt; wrappers, flagged spans withheld</text>

  <text x="616" y="488" class="lbl">LLM CLIENT</text>
  <rect x="616" y="498" width="560" height="96" rx="5" class="box"/>
  <text x="632" y="522" class="s">structured output → Pydantic validation → at most one repair → controlled error</text>
  <text x="632" y="541" class="s">Gemini (default) or Anthropic · model chain: next model when a daily quota is used up</text>
  <text x="632" y="560" class="s">budgets: tokens, requests per case · whole chain used up → case pauses, resumes after reset</text>
  <text x="632" y="579" class="s">per-case reply cache: a resumed case replays finished steps without API requests</text>

  <path d="M300,460 L300,496" class="l" marker-end="url(#a)"/>
  <path d="M890,460 L890,496" class="l" marker-end="url(#a)"/>

  <!-- third layer: retrieval, calc, memory -->
  <text x="24" y="622" class="lbl">RETRIEVAL</text>
  <rect x="24" y="632" width="380" height="104" rx="5" class="box"/>
  <text x="40" y="656" class="s">BM25 + one vector index (local bge-small, fastembed)</text>
  <text x="40" y="674" class="s">fused with Reciprocal Rank Fusion (k = 60)</text>
  <text x="40" y="692" class="s">filters: country, sector, event, source type, tier, dates</text>
  <text x="40" y="710" class="s">publication date ≤ as-of on every path · duplicates hidden</text>
  <text x="40" y="728" class="s">identical query → reused from cache (logged)</text>

  <text x="430" y="622" class="lbl">CALCULATIONS</text>
  <rect x="430" y="632" width="360" height="104" rx="5" class="box"/>
  <text x="446" y="656" class="s">deterministic Python: sum, mean, YoY, share, offset</text>
  <text x="446" y="674" class="s">inputs = trade row IDs, through the as-of gate</text>
  <text x="446" y="692" class="s">invalid / missing rows excluded with a reason</text>
  <text x="446" y="710" class="s">(missing never becomes zero) · every record replays</text>
  <text x="446" y="728" class="s">estimate bounds must equal calc results</text>

  <text x="816" y="622" class="lbl">PRIVATE MEMORY</text>
  <rect x="816" y="632" width="360" height="104" rx="5" class="box"/>
  <text x="832" y="656" class="s">one store per agent, owner-bound (no shared reads)</text>
  <text x="832" y="674" class="s">general lessons written after rulings (names, IDs,</text>
  <text x="832" y="692" class="s">numbers masked) · recalled by stage</text>
  <text x="832" y="710" class="s">MEMORY_APPLIED logs the plan without memory vs</text>
  <text x="832" y="728" class="s">the plan with it · read via each agent's own tools</text>

  <path d="M214,594 L214,630" class="l" marker-end="url(#a)"/>
  <path d="M520,594 L580,630" class="l" marker-end="url(#a)"/>

  <!-- store + ingest -->
  <text x="24" y="764" class="lbl">SQLITE STORE</text>
  <rect x="24" y="774" width="560" height="104" rx="5" class="box"/>
  <text x="40" y="798" class="s">documents · paragraphs (stable refs) · trade tables and rows · relations</text>
  <text x="40" y="816" class="s">append-only audit log → JSONL: QUERY, RETRIEVED, CLAIM, ATTACK,</text>
  <text x="40" y="834" class="s">DEFENSE, CONCESSION, RULING, SENDBACK, MEMORY_*, TRAP_INJECTION, …</text>
  <text x="40" y="852" class="s">agent memory · query cache · calculations · reply cache · model quota</text>
  <text x="40" y="870" class="s">+ logs/cases/&lt;id&gt;/: case file, claims, rulings, briefing per run</text>

  <text x="616" y="764" class="lbl">INGEST PIPELINE (ANY PACK, NO CODE CHANGES)</text>
  <rect x="616" y="774" width="560" height="104" rx="5" class="box"/>
  <text x="632" y="798" class="s">manifest + KEY: value headers · PDF (pypdf) · DOCX · TXT (encoding detection)</text>
  <text x="632" y="816" class="s">[Pn] paragraphs · trade tables: prose notes and fixed text layout</text>
  <text x="632" y="834" class="s">damage flags: empty, cut off, bad encoding, bad rows (reported, never used silently)</text>
  <text x="632" y="852" class="s">duplicates, near-duplicates, corrections / retractions linked</text>
  <text x="632" y="870" class="bad">injection scanner: instructions in documents flagged, withheld, logged</text>

  <path d="M614,826 L586,826" class="l" marker-end="url(#a)"/>
  <path d="M214,736 L214,772" class="ld" marker-start="url(#a)"/>
  <path d="M1176,77 L1190,77 L1190,826 L1178,826" class="ld" marker-end="url(#a)"/>
  <text x="1080" y="760" class="s">POST /ingest</text>
</svg>
